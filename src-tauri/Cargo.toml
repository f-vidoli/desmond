[package]
name = "desmond"
version = "0.1.0"
description = "Desmond desktop and mobile shell"
authors = []
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desmond_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
