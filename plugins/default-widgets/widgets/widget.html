<article class="widget widget-base">
  <header class="widget-head">
    <h2 class="widget-title">{{title}}</h2>
    <span class="widget-status">{{status}}</span>
  </header>
  <div class="widget-body">{{body}}</div>
  <div class="widget-hierarchy" data-slot="hierarchy"></div>
  <div class="widget-children" data-slot="widgets"></div>
</article>
