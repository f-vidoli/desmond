<section class="widget widget-feed">
  <header class="widget-head">
    <h2 class="widget-title">{{title}}</h2>
    <span class="feed-status">{{status}}</span>
  </header>
  <p class="widget-body">{{body}}</p>
  <div class="widget-hierarchy" data-slot="hierarchy"></div>
  <div class="widget-children" data-slot="widgets"></div>
  <footer class="widget-foot">
    <span>{{source}}</span>
    <button type="button" data-action="refresh-feed">Refresh</button>
  </footer>
</section>
